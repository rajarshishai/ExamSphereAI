<!-- Global Toast Container -->
<aside aria-label="Notifications" class="fixed top-20 right-4 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto p-4 rounded-2xl shadow-xl border flex items-start gap-3 transition-all duration-300 animate-fadeIn"
      [ngClass]="{
        'bg-emerald-50 text-emerald-900 border-emerald-200': toast.type === 'success',
        'bg-rose-50 text-rose-900 border-rose-200': toast.type === 'error',
        'bg-amber-50 text-amber-900 border-amber-200': toast.type === 'warning',
        'bg-blue-50 text-blue-900 border-blue-200': toast.type === 'info'
      }"
    >
      <div class="text-lg shrink-0 mt-0.5">
        @if (toast.type === 'success') { ✅ }
        @else if (toast.type === 'error') { ⚠️ }
        @else if (toast.type === 'warning') { 🔔 }
        @else { ℹ️ }
      </div>
      <div class="flex-grow text-xs sm:text-sm font-semibold leading-snug">
        {{ toast.message }}
      </div>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        class="text-slate-400 hover:text-slate-700 text-xs font-bold shrink-0 ml-1 cursor-pointer"
      >
        ✕
      </button>
    </div>
  }
</aside>
